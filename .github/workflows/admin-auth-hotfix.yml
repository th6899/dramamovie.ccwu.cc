name: Production admin auth hotfix validation

on:
  push:
    branches: [fix/production-admin-auth-v2.0.2]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-admin-hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate admin module syntax
        run: node --input-type=module --check < admin-v2.0.1.js
      - name: Validate auth recovery and cache version
        shell: python
        run: |
          from pathlib import Path
          js = Path("admin-v2.0.1.js").read_text()
          html = Path("admin.html").read_text()
          assert "entrypoint\\nimport" not in js, "literal escaped newline still comments out the module import"
          assert "import { createClient }" in js
          staff = js.split("async function checkStaff(user)", 1)[1].split("function fillSelect", 1)[0]
          assert "auth.signOut" not in staff, "staff-check failure must preserve the authenticated session for diagnosis"
          assert 'Admin Build v2.0.2' in html
          assert 'admin-v2.0.1.js?v=2.0.2' in html
          print("Production admin import, auth recovery, and cache-busting checks passed.")
